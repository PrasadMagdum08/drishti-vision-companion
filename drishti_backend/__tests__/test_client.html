<!DOCTYPE html>
<html>
<head>
    <title>Drishti Backend Sandbox</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #121212; color: white; margin: 0; padding: 20px; }
        video { width: 640px; height: 480px; background: #000; border: 3px solid #00e676; border-radius: 10px; box-shadow: 0 0 20px rgba(0, 230, 118, 0.2); }
        #controls { margin: 20px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button { background: #2979ff; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #005ecb; transform: translateY(-2px); }
        button.jarvis { background: #ff5252; border: 2px solid white; box-shadow: 0 0 10px rgba(255, 82, 82, 0.5); }
        button.jarvis:hover { background: #d32f2f; }
        button.voice-test { background: #6a1b9a; }
        #logs { margin: 0 auto; width: 640px; padding: 15px; background: #1e1e1e; height: 250px; overflow-y: auto; text-align: left; font-family: 'Consolas', monospace; border-radius: 10px; border: 1px solid #333; box-shadow: inset 0 0 10px #000; }
        .log-entry { margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #2a2a2a; font-size: 13px; }
        .alert { color: #ff5252; font-weight: bold; }
        .ai { color: #00e676; }
        .system { color: #9e9e9e; font-style: italic; }
        .user-voice { color: #2979ff; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🧠 Drishti Brain Monitor</h2>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;" width="640" height="480"></canvas>

    <div id="controls">
        <button class="jarvis" onclick="startVoiceCommand()">🎤 Speak to Jarvis</button>
        <button onclick="sendAction('describe')">📷 Describe Scene</button>
        <button onclick="sendAction('read_text')">📖 Read Text</button>
        <button onclick="sendAction('analyze_face')">👤 Analyze Face</button>
        <button class="voice-test" onclick="speak('Voice system is active')">🔊 Test Voice</button>
    </div>

    <div id="logs"></div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logs = document.getElementById('logs');

        let ws;
        let streamInterval;

        // --- 🔊 TTS SYSTEM ---
        function speak(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95;
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        // --- 🎤 STT SYSTEM (Professional Clarification Logic) ---
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) {
            alert("Your browser does not support Speech Recognition. Please use Chrome.");
        }
        const recognition = new Recognition();
        recognition.continuous = false;
        recognition.lang = 'en-US';

        function startVoiceCommand() {
            try {
                recognition.start();
                log("👂 Listening for command...", "system");
            } catch (e) {
                console.log("Recognition already active");
            }
        }

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim();
            
            if (transcript.length === 0) {
                log("❓ Unclear audio detected.", "alert");
                speak("Can you repeat what you just said?");
                return;
            }

            log(`🗣️ You: "${transcript}"`, "user-voice");
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "voice_command",
                    text: transcript
                }));
            }
        };

        recognition.onerror = (err) => {
            if (err.error === 'no-speech') {
                // CASE: User Triggered but stayed silent
                log("❓ Silence detected.", "alert");
                speak("I'm listening, you can speak.");
            } else if (err.error === 'audio-capture' || err.error === 'network') {
                log("Mic or Network error.", "alert");
            } else {
                // CASE: Audio detected but was unintelligible (mumble/noise)
                log("❓ Audio was unintelligible.", "alert");
                speak("Can you repeat what you just said?");
            }
        };

        function log(msg, type = "normal") {
            const div = document.createElement("div");
            div.className = `log-entry ${type}`;
            div.innerText = `> ${msg}`;
            logs.prepend(div);
        }

        // 1. Start Webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                log("Webcam active. Connecting...", "system");
                connectWebSocket();
            })
            .catch(err => log("Webcam error: Allow camera access.", "alert"));

        // 2. WebSocket
        function connectWebSocket() {
            ws = new WebSocket('ws://127.0.0.1:8000/ws/vision/stream/');

            ws.onopen = () => {
                log("✅ Connected to Backend!", "ai");
                speak("Connected to Drishti");
                streamInterval = setInterval(sendFrame, 500);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "obstacle") {
                    log(`⚠️ YOLO: ${data.alert}`, "alert");
                } else if (data.text) {
                    log(`🤖 AI: ${data.text}`, "ai");
                    speak(data.text);
                } else if (data.type === "stop_audio") {
                    window.speechSynthesis.cancel();
                    log("🛑 Audio Stopped", "alert");
                }
            };

            ws.onclose = () => {
                log("🔌 Disconnected. Retrying...", "alert");
                clearInterval(streamInterval);
                setTimeout(connectWebSocket, 3000);
            };
        }

        // 3. Send Frame
        function sendFrame() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                ws.send(JSON.stringify({ type: "video_frame", data: dataUrl }));
            }
        }

        // 4. Test Actions
        function sendAction(action) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log(`📤 Command: ${action}`, "system");
                ws.send(JSON.stringify({ action: action }));
            }
        }
    </script>
</body>
</html>
