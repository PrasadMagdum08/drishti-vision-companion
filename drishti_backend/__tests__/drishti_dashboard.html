<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drishti AI Visual Control Center</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #00e676; text-shadow: 0 0 10px #00e676; }
        
        /* Main Layout */
        .container { position: relative; width: 640px; height: 480px; margin-top: 20px; border: 3px solid #333; }
        
        /* Layers */
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        
        /* Controls */
        .controls { margin-top: 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        button { padding: 15px 25px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        
        /* Button Colors */
        .btn-describe { background-color: #2979ff; color: white; }
        .btn-describe:hover { background-color: #004ecb; }
        
        .btn-read { background-color: #ff9100; color: white; }
        .btn-read:hover { background-color: #c56200; }

        .btn-face { background-color: #d500f9; color: white; }
        .btn-face:hover { background-color: #9e00c5; }

        .btn-save { background-color: #6200ea; color: white; }
        .btn-save:hover { background-color: #3f00b5; }

        .btn-voice { background-color: #ff5252; color: white; border: 2px solid white; } /* Jarvis Button */
        .btn-voice:hover { background-color: #d32f2f; box-shadow: 0 0 15px #ff5252; }

        /* Output Logs */
        .log-box { margin-top: 20px; width: 640px; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #444; min-height: 100px; max-height: 200px; overflow-y: auto; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        /* Text Styles */
        .alert-text { color: #ff5252; font-weight: bold; }
        .info-text { color: #2979ff; }
        .read-text { color: #ff9100; }
        .face-text { color: #d500f9; font-weight: bold; }
        .voice-text { color: #00e676; font-style: italic; }
    </style>
</head>
<body>

    <h1>👁️ DRISHTI CONTROL CENTER</h1>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>

    <div class="log-box" id="output">
        <div class="log-entry">Waiting for system...</div>
    </div>

    <div class="controls">
        <button class="btn-describe" onclick="triggerAction('describe')">🖼️ Describe Scene</button>
        <button class="btn-read" onclick="triggerAction('read_text')">📖 Read Text</button>
        <button class="btn-face" onclick="triggerAction('analyze_face')">👤 Check Face</button>
        <button class="btn-save" onclick="saveFacePrompt()">💾 Save Face</button>
        <button class="btn-voice" onclick="startVoiceRecognition()">🎙️ Talk to Jarvis</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const output = document.getElementById('output');
        
        const socket = new WebSocket('ws://127.0.0.1:8000/ws/vision/stream/');
        const FPS = 200; 
        let isConnected = false;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };
            } catch (err) {
                log("❌ Camera Error: " + err, "alert-text");
            }
        }

        socket.onopen = () => {
            isConnected = true;
            log("✅ Connected to Drishti Brain", "info-text");
            startStreaming();
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            // 🛑 NEW: KILL SWITCH HANDLER
            if (data.type === 'stop_audio') {
                window.speechSynthesis.cancel(); // Forces browser to shut up immediately
                log("🛑 STOPPED", "alert-text");
                return;
            }

            if (data.type === 'obstacle') {
                drawBoxes(data.detections);
                if (data.alert) document.title = "⚠️ " + data.alert; 
            }
            else if (data.type === 'description') {
                log("🗣️ SCENE: " + data.text, "info-text");
                speak(data.text);
            }
            else if (data.type === 'read_text') {
                log("📜 READ: " + data.text, "read-text");
                speak(data.text);
            }
            else if (data.type === 'face_result') {
                log("👤 FACE: " + data.text, "face-text");
                speak(data.text);
            }
            else if (data.type === 'info') {
                log("ℹ️ " + data.text, "info-text");
            }
        };

        function startStreaming() {
            setInterval(() => {
                if (!isConnected) return;
                const hiddenCanvas = document.createElement('canvas');
                hiddenCanvas.width = video.videoWidth;
                hiddenCanvas.height = video.videoHeight;
                const hCtx = hiddenCanvas.getContext('2d');
                hCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                hiddenCanvas.toBlob((blob) => {
                    socket.send(blob);
                }, 'image/jpeg', 0.8);
            }, FPS);
        }

        function triggerAction(actionName) {
            log("⏳ Asking AI...", "info-text");
            socket.send(JSON.stringify({ "action": actionName }));
        }

        function saveFacePrompt() {
            let name = prompt("Who is this person?");
            if (name) {
                log("💾 Saving Face for " + name + "...", "face-text");
                socket.send(JSON.stringify({ "action": "save_face", "name": name }));
            }
        }

        /**
         * JARVIS VOICE LOGIC
         * Uses Browser's SpeechRecognition to avoid Python installation issues.
         */
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("❌ Browser does not support Voice Recognition", "alert-text");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            log("👂 Jarvis is listening...", "voice-text");
            recognition.start();

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                log("🗣️ You said: " + speechToText, "voice-text");
                
                // Send as voice_command to trigger Backend Intent Mapping
                socket.send(JSON.stringify({
                    "type": "voice_command",
                    "text": speechToText
                }));
            };

            recognition.onerror = (event) => {
                log("❌ Voice Error: " + event.error, "alert-text");
            };
        }

        function drawBoxes(detections) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            detections.forEach(det => {
                const [x1, y1, x2, y2] = det.box;
                ctx.strokeStyle = "#00e676";
                ctx.lineWidth = 3;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                ctx.fillStyle = "#00e676";
                ctx.font = "18px Arial";
                ctx.fillText(`${det.object} (${det.confidence.toFixed(2)})`, x1, y1 - 5);
            });
        }

        function log(msg, className="") {
            output.innerHTML = `<div class="log-entry ${className}">${new Date().toLocaleTimeString()} - ${msg}</div>` + output.innerHTML;
        }

        function speak(text) {
            // Cancel any old speech before starting new one (Prevents overlap)
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        startCamera();
    </script>
</body>
</html>
