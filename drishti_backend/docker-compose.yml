version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: drishti_db
    environment:
      - POSTGRES_DB=drishti_db
      - POSTGRES_USER=drishti_user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti_user -d drishti_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.0
    container_name: drishti_cache
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data: